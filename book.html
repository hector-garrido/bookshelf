<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Anotaciones de lectura de mi biblioteca personal.">
    <title>Libro | Mis libros</title>

    <!-- Reusing an existing cover prevents an unnecessary missing favicon request. -->
    <link rel="icon" href="data/images/Eva%20Luna.jpg">

    <!-- Book pages reuse the same materials, type and controls as the main library. -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="book-page">
    <header class="app-bar">
        <a class="back-button" href="index.html" aria-label="Volver a la biblioteca">
            <span aria-hidden="true">‹</span>
            Biblioteca
        </a>
        <a class="brand brand--centered" href="index.html">Mis libros</a>
        <span class="app-bar__spacer" aria-hidden="true"></span>
    </header>

    <main id="book-main" class="book-main">
        <div id="book-status" class="book-loading" role="status">Buscando el libro en el estante…</div>

        <!-- JavaScript reveals this complete reading view once its Markdown file is loaded. -->
        <article id="book-view" class="book-view" hidden>
            <header class="book-hero">
                <div class="book-hero__cover-wrap">
                    <img id="book-cover" class="book-hero__cover" src="" alt="">
                </div>
                <div class="book-hero__copy">
                    <p class="eyebrow">Cuaderno de lectura</p>
                    <h1 id="book-title"></h1>
                    <p>Contenido, citas y reflexiones reunidos durante la lectura.</p>
                    <nav id="book-nav" class="book-nav" aria-label="Secciones del libro"></nav>
                </div>
            </header>

            <div class="paper-stack" aria-hidden="true"></div>
            <div id="book-notes" class="book-notes"></div>
        </article>
    </main>

    <footer class="site-footer">
        <a href="index.html">Volver al estante</a>
    </footer>

    <!-- The query-string slug selects one book while keeping a single maintainable template. -->
    <script type="module" src="js/book.js"></script>
</body>
</html>
